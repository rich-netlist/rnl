# Builds and tests the desktop viewer in apps/desktop, a Cargo workspace of its own so that its
# WebView dependencies stay out of the library crates' builds.
name: Desktop viewer

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "libraries/**"
      - "rustfmt.toml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "libraries/**"
      - "rustfmt.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - name: Lints
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path apps/desktop/Cargo.toml
      - name: Check the page's script
        if: matrix.os == 'ubuntu-latest'
        run: node --check apps/desktop/ui/main.js

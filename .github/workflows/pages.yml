# Builds the project site and publishes it to GitHub Pages: the pages in site/ (the introduction, the
# language tour, the page of the tools, the gallery of the standard packages and the page for agents),
# the pages of the language standard (scripts/spec/), the RNL skill package for agents, as a zip and as
# plain text, with llms.txt (scripts/skill/), the web viewer with its samples (apps/web) under viewer/,
# and the gallery's data, from libraries/, under gallery/. It publishes on a push to main; after a revision
# of the standard is released, so that its pages carry the new revision label; and after a release of
# the desktop viewer, so that the page of the tools links to its files.
# Pull requests only run the build, which fails when an English source or translation markup is invalid, when a
# check of the standard fails (decision 0007), when the web viewer does not build, or when the
# gallery cannot read a package file or draw a symbol.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "site/**"
      - "scripts/site_i18n.py"
      - "i18n/**"
      - "apps/desktop/release-notes/**"
      - "release-notes/**"
      - "spec/**"
      - "scripts/spec/**"
      - "scripts/skill/**"
      - "brand/**"
      - "scripts/brand*"
      - "skills/**"
      - ".github/actions/install-spec-tools/**"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "site/**"
      - "scripts/site_i18n.py"
      - "i18n/**"
      - "apps/desktop/release-notes/**"
      - "release-notes/**"
      - "spec/**"
      - "scripts/spec/**"
      - "scripts/skill/**"
      - "brand/**"
      - "scripts/brand*"
      - "skills/**"
      - ".github/actions/install-spec-tools/**"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  # The releases of the standard (spec-release.yml) and of the desktop viewer (viewer-release.yml) run
  # on a tag, but only main may deploy to github-pages; this run builds main, and its checkout has the
  # new tag.
  workflow_run:
    workflows: ["Standard release", "Viewer release", "Publish runtime"]
    types: [completed]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Each job gets only what it needs: the build reads the repository and the Pages site
# (configure-pages); only the deploy job writes to Pages, with the OIDC token deploy-pages asks for.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    # A manual Viewer rehearsal only validates artifacts; only the tag-push release should
    # refresh the website. Other release workflows retain their existing behavior.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name != 'Viewer release' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    # A build normally takes 5 to 10 minutes; with slow downloads, successful builds have taken up to
    # 70. A hung build fails here instead of running for GitHub's default of six hours.
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags give the revision label of the standard (decision 0007), and the desktop viewer's
          # newest release, whose files the page of the tools links to
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      # Writes site/dist/: the Chinese pages under zh/ and the English pages under en/, index.html, which
      # leads to either by the browser's language, and the old addresses of the Chinese pages, which lead
      # to zh/; the page of the tools has the files of the newest tag viewer-vX.Y.Z. site/README.md,
      # site/build.py and site/src/ stay out of the published site.
      - name: Download and verify locked public packages
        working-directory: ${{ github.workspace }}
        run: python scripts/packages.py download
      - name: Build the site
        run: |
          python3 -m unittest discover -s site -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_packages.py'
          python3 site/build.py

      # Normally under half a minute, about 12 with slow downloads; one run hung here for over 1.5 hours.
      - uses: ./.github/actions/install-spec-tools
        timeout-minutes: 15

      # Checks every version of the standard in spec/, then writes the pages and downloads of each:
      # site/dist/zh/spec/<version>/ (Chinese) and site/dist/en/spec/<version>/ (English), with the pages
      # that compare it with each earlier version, and the old addresses of the Chinese pages of 0.2,
      # under site/dist/spec/; site/dist/zh/spec/ and site/dist/en/spec/ lead to the
      # newest version.
      - name: Build the pages of the standard
        run: python3 scripts/spec/build.py --site site/dist

      # The RNL skill package, for agents: site/dist/skill/rnl-skill.zip, the files of the package as plain
      # text under site/dist/skill/rnl/, a manifest and the hashes, and the plain-text entry that agents look
      # for, site/dist/llms.txt (English) and site/dist/zh/llms.txt (Chinese), which the page for agents,
      # agents.html, links. The package is checked by skill.yml.
      - name: Build the skill package for agents
        run: python3 scripts/skill/build.py --site site/dist

      # The web viewer, one copy for both languages: the core as WebAssembly, the page of
      # apps/viewer-ui with its web fonts, and the conformance corpus as samples.
      - name: Install Rust with the WebAssembly target
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # the crates the core depends on, and what was built of them for WebAssembly
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/wasm/
            target/wasm32-unknown-unknown/
          key: pages-wasm-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-wasm-${{ steps.rust.outputs.version }}-
      - name: Check and render the site's example netlists
        run: |
          cargo build -p rnl-cli
          python3 site/build.py --check --rnl target/debug/rnl
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Writing the web fonts from the pinned fonts takes scripts/fonts.py a minute or two, and what it
      # writes changes only with the script, so it is kept between runs.
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/viewer-ui/fonts/
          key: web-fonts-${{ hashFiles('scripts/fonts.py') }}
      - if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # downloads the pinned fonts and writes apps/viewer-ui/fonts/, the drawing's web fonts
      - name: Write the web fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: pip install fonttools brotli && python scripts/fonts.py web
      # writes apps/web/dist/, including libraries/*.rnl, index.json and bundled.json,
      # and puts it at site/dist/viewer/, where the pages of both languages link
      - name: Build the web viewer, with samples and the package library
        run: |
          node --test apps/web/*.test.mjs
          node apps/web/build.mjs --samples
          cp -r apps/web/dist site/dist/viewer

      # The data of the gallery of the standard packages (packages.html), which the pages of both
      # languages load: every package file in libraries/ read, and every symbol drawn by the core the
      # step above built into bindings/runtime-wasm/dist/, written into site/dist/gallery/. The tests of
      # its reading of package files run first.
      - name: Build the gallery of the standard packages
        run: |
          node --test site/gallery/package-file.test.mjs
          node site/gallery/build.mjs

      - name: Use the locked offline catalog for browser tests
        run: |
          python scripts/packages.py fixture
          echo "RNL_PACKAGE_CATALOG=$GITHUB_WORKSPACE/.rnl-packages/fixture/catalog.json" >> "$GITHUB_ENV"
      # The browsers' system packages (--with-deps, about 120 MB for WebKit) come from the runner's Ubuntu
      # mirror, which was slow for 15 to 50 minutes in several runs on 2026-10-23 and 24, in bursts that apt's
      # timeouts do not catch. So the downloaded .deb files are kept between runs by actions/cache, keyed by
      # the runner image and the Playwright lock file; a run installs from them and downloads only what
      # changed. They are kept even when the install fails, so a slow run still moves the next one forward.
      # A run with nothing cached can take a quarter of an hour on a slow mirror; normally it takes 1 minute.
      - name: Name the cache of the browsers' system packages
        id: apt
        run: echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers' system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.apt.outputs.image }}-${{ hashFiles('tests/viewer/package-lock.json') }}-full
          restore-keys: |
            apt-debs-${{ steps.apt.outputs.image }}-${{ hashFiles('tests/viewer/package-lock.json') }}-
            apt-debs-${{ steps.apt.outputs.image }}-
            apt-debs-
      - name: Install the browsers for the site checks
        id: install
        timeout-minutes: 30
        run: |
          sudo tee /etc/apt/apt.conf.d/80-rnl-network <<'CONF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          CONF
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then
            sudo cp -n ~/apt-debs/*.deb /var/cache/apt/archives/
            echo "Restored $(ls ~/apt-debs/*.deb | wc -l) cached packages"
          fi
          npm ci --prefix tests/viewer
          node tests/viewer/node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: Keep the downloaded system packages
        id: apt-keep
        if: always() && steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-debs
          cp -n /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          count=$(ls ~/apt-debs/*.deb 2>/dev/null | wc -l)
          echo "Keeping $count packages"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # A complete set takes the exact key the next run looks for; what a failed install left is only a
          # fallback, under a key of its own, so that a later successful run can store the complete set.
          base="apt-debs-${{ steps.apt.outputs.image }}-${{ hashFiles('tests/viewer/package-lock.json') }}"
          if [ "${{ steps.install.outcome }}" = success ]; then echo "key=$base-full" >> "$GITHUB_OUTPUT"
          else echo "key=$base-partial-${{ github.run_id }}" >> "$GITHUB_OUTPUT"; fi
      - name: Save the browsers' system packages
        if: always() && steps.apt-keep.outputs.count != '' && steps.apt-keep.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-keep.outputs.key }}
      # Normally about 5 minutes.
      - name: Check site navigation in Chromium and WebKit
        timeout-minutes: 25
        env:
          RNL_SITE_SCREENSHOTS: ${{ runner.temp }}/package-review
          RNL_I18N_SCREENSHOTS: ${{ runner.temp }}/package-review/language-menu
          RNL_MACOS_SCREENSHOTS: ${{ runner.temp }}/package-review/macos
          RNL_TIMELINE_SCREENSHOTS: ${{ runner.temp }}/package-review/timeline
        run: |
          node --test scripts/brand.test.mjs
          node tests/viewer/node_modules/@playwright/test/cli.js test --config site/playwright.config.mjs

      - name: Keep bilingual light and dark review screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-package-review-screenshots
          path: ${{ runner.temp }}/package-review
          if-no-files-found: error

      - name: Restore production gallery from the latest catalog
        env:
          RNL_PACKAGE_CATALOG: https://rich-netlist.github.io/rnl-packages/catalog.json
        run: node site/gallery/build.mjs

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

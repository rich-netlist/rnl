# Builds the project site and publishes it to GitHub Pages: the pages in site/ (the introduction, the
# language tour, the page of the tools, the gallery of the standard packages and the page for agents),
# the pages of the language standard (scripts/spec/), the RNL skill package for agents, as a zip and as
# plain text, with llms.txt (scripts/skill/), the web viewer with its samples (apps/web) under viewer/,
# and the gallery's data, from libraries/, under gallery/. It publishes on a push to main; after a revision
# of the standard is released, so that its pages carry the new revision label; and after a release of
# the desktop viewer, so that the page of the tools links to its files.
# Pull requests only run the build, which fails when a text is missing one of its languages, when a
# check of the standard fails (decision 0007), when the web viewer does not build, or when the
# gallery cannot read a package file or draw a symbol.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "spec/**"
      - "scripts/spec/**"
      - "scripts/skill/**"
      - "skills/**"
      - ".github/actions/install-spec-tools/**"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "spec/**"
      - "scripts/spec/**"
      - "scripts/skill/**"
      - "skills/**"
      - ".github/actions/install-spec-tools/**"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  # The releases of the standard (spec-release.yml) and of the desktop viewer (viewer-release.yml) run
  # on a tag, but only main may deploy to github-pages; this run builds main, and its checkout has the
  # new tag.
  workflow_run:
    workflows: ["Standard release", "Viewer release"]
    types: [completed]
  workflow_dispatch:

# Each job gets only what it needs: the build reads the repository and the Pages site
# (configure-pages); only the deploy job writes to Pages, with the OIDC token deploy-pages asks for.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags give the revision label of the standard (decision 0007), and the desktop viewer's
          # newest release, whose files the page of the tools links to
          fetch-depth: 0

      # Writes site/dist/: the Chinese pages under zh/ and the English pages under en/, index.html, which
      # leads to either by the browser's language, and the old addresses of the Chinese pages, which lead
      # to zh/; the page of the tools has the files of the newest tag viewer-vX.Y.Z. site/README.md,
      # site/build.py and site/src/ stay out of the published site.
      - name: Build the site
        run: python3 site/build.py

      - uses: ./.github/actions/install-spec-tools

      # Checks every version of the standard in spec/, then writes the pages and downloads of each:
      # site/dist/zh/spec/<version>/ (Chinese) and site/dist/en/spec/<version>/ (English), with the pages
      # that compare it with each earlier version, and the old addresses of the Chinese pages of 0.2,
      # under site/dist/spec/; site/dist/zh/spec/ and site/dist/en/spec/ lead to the
      # newest version.
      - name: Build the pages of the standard
        run: python3 scripts/spec/build.py --site site/dist

      # The RNL skill package, for agents: site/dist/skill/rnl-skill.zip, the files of the package as plain
      # text under site/dist/skill/rnl/, a manifest and the hashes, and the plain-text entry that agents look
      # for, site/dist/llms.txt (English) and site/dist/zh/llms.txt (Chinese), which the page for agents,
      # agents.html, links. The package is checked by skill.yml.
      - name: Build the skill package for agents
        run: python3 scripts/skill/build.py --site site/dist

      # The web viewer, one copy for both languages: the core as WebAssembly, the page of
      # apps/viewer-ui with its web fonts, and the conformance corpus as samples.
      - name: Install Rust with the WebAssembly target
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # the crates the core depends on, and what was built of them for WebAssembly
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/wasm/
            target/wasm32-unknown-unknown/
          key: pages-wasm-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-wasm-${{ steps.rust.outputs.version }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Writing the web fonts from the pinned fonts takes scripts/fonts.py a minute or two, and what it
      # writes changes only with the script, so it is kept between runs.
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/viewer-ui/fonts/
          key: web-fonts-${{ hashFiles('scripts/fonts.py') }}
      - if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # downloads the pinned fonts and writes apps/viewer-ui/fonts/, the drawing's web fonts
      - name: Write the web fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: pip install fonttools brotli && python scripts/fonts.py web
      # writes apps/web/dist/, and puts it at site/dist/viewer/, where the pages of both languages link
      - name: Build the web viewer, with the samples
        run: |
          node apps/web/build.mjs --samples
          cp -r apps/web/dist site/dist/viewer

      # The data of the gallery of the standard packages (packages.html), which the pages of both
      # languages load: every package file in libraries/ read, and every symbol drawn by the core the
      # step above built into bindings/runtime-wasm/dist/, written into site/dist/gallery/. The tests of
      # its reading of package files run first.
      - name: Build the gallery of the standard packages
        run: |
          node --test site/gallery/package-file.test.mjs
          node site/gallery/build.mjs

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

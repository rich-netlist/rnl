# Builds the project site and publishes it to GitHub Pages: the pages in site/ (the introduction, the
# language tour, the page of the tools, the gallery of the standard packages and the page for agents),
# the pages of the language standard (scripts/spec/), the RNL skill package for agents, as a zip and as
# plain text, with llms.txt (scripts/skill/), the web viewer with its samples (apps/web) under viewer/, as it is
# at the last release of the 0.5 line (LAST_05_RELEASE below, until the site moves to the language 0.4),
# the same viewer frozen at an older tag, for 0.3 files, under viewer-0.3/, and the gallery's data, from
# libraries/, under gallery/. It publishes on a push to main; after a revision
# of the standard is released, so that its pages carry the new revision label; and after a release of
# the desktop viewer, so that the page of the tools links to its files.
# Pull requests only run the build, which fails when an English source or translation markup is invalid, when a
# check of the standard fails (decision 0007), when the web viewer does not build, or when the
# gallery cannot read a package file or draw a symbol.
# Requires Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "site/**"
      - "scripts/site_i18n.py"
      - "i18n/**"
      - "apps/desktop/release-notes/**"
      - "release-notes/**"
      - "spec/**"
      - "scripts/spec/**"
      - "scripts/skill/**"
      - "brand/**"
      - "scripts/brand*"
      - "skills/**"
      - ".github/actions/install-spec-tools/**"
      - ".github/actions/install-playwright/**"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "site/**"
      - "scripts/site_i18n.py"
      - "i18n/**"
      - "apps/desktop/release-notes/**"
      - "release-notes/**"
      - "spec/**"
      - "scripts/spec/**"
      - "scripts/skill/**"
      - "brand/**"
      - "scripts/brand*"
      - "skills/**"
      - ".github/actions/install-spec-tools/**"
      - ".github/actions/install-playwright/**"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "tests/conformance/**"
      - ".github/workflows/pages.yml"
  # The releases of the standard (spec-release.yml) and of the desktop viewer (viewer-release.yml) run
  # on a tag, but only main may deploy to github-pages; this run builds main, and its checkout has the
  # new tag.
  workflow_run:
    workflows: ["Standard release", "Viewer release", "Publish runtime"]
    types: [completed]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Each job gets only what it needs: the build reads the repository and the Pages site
# (configure-pages); only the deploy job writes to Pages, with the OIDC token deploy-pages asks for.
# A newer push to the same pull request cancels this run. A run on main or on a tag, and a manual,
# scheduled or called run, has a group of its own, so it is never cancelled or held back.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  # The tag of the viewer for 0.3 files, which the site keeps at viewer-0.3/ as it was then (below, after the
  # web viewer). It is the newest release of the viewer while 0.3 is the current version of the language; when
  # 0.4 is released it is the tag of the last release of the 0.5 line, which reads 0.3 files.
  FROZEN_VIEWER_TAG: viewer-v0.5.3
  # The last release of the 0.5 line of the core, which reads 0.2, 0.3 and 0.4. Until the site moves to the language
  # 0.4, the site is built with it, not with main, whose core reads 0.4 only: the web viewer at viewer/ is built at
  # this tag (so it no longer changes with every merge into main), the skill package for agents and llms.txt are
  # published as they are there, the site's example netlists and the logo are checked with its command line, and
  # the gallery draws its symbols with its npm package @rich-netlist/runtime.
  # Moving to a newer release of the 0.5 line is this line alone.
  LAST_05_RELEASE: core-v0.5.6

jobs:
  build:
    # A manual Viewer rehearsal only validates artifacts; only the tag-push release should
    # refresh the website. Other release workflows retain their existing behavior.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name != 'Viewer release' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    # A build normally takes 5 to 10 minutes; with slow downloads, successful builds have taken up to
    # 70. A hung build fails here instead of running for GitHub's default of six hours.
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags give the revision label of the standard (decision 0007), and the desktop viewer's
          # newest release, whose files the page of the tools links to
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      # Writes site/dist/: the Chinese pages under zh/ and the English pages under en/, index.html, which
      # leads to either by the browser's language, and the old addresses of the Chinese pages, which lead
      # to zh/; the page of the tools has the files of the newest tag viewer-vX.Y.Z. site/README.md,
      # site/build.py and site/src/ stay out of the published site.
      - name: Download and verify locked public packages
        working-directory: ${{ github.workspace }}
        run: python scripts/packages.py download
      - name: Build the site
        run: |
          python3 -m unittest discover -s site -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_packages.py'
          # --online: the translation status also counts what rnl-gallery and rnl-packages publish
          python3 site/build.py --online

      # Normally under half a minute, about 12 with slow downloads; one run hung here for over 1.5 hours.
      - uses: ./.github/actions/install-spec-tools
        timeout-minutes: 15

      # Checks every version of the standard in spec/, then writes the pages and downloads of each
      # released one (a version whose folder holds a file RELEASED):
      # site/dist/zh/spec/<version>/ (Chinese) and site/dist/en/spec/<version>/ (English), with the pages
      # that compare it with each earlier version, and the old addresses of the Chinese pages of 0.2,
      # under site/dist/spec/; site/dist/zh/spec/ and site/dist/en/spec/ lead to the
      # newest released version. The tests of which versions it shows run first.
      - name: Build the pages of the standard
        run: |
          python3 -m unittest discover -s scripts/spec -p 'test_build.py'
          python3 scripts/spec/build.py --site site/dist

      # The tag LAST_05_RELEASE, checked out beside the workspace: the skill package and the web viewer below are
      # published as they are there, until the site moves to the language 0.4.
      - name: Check out the tag of the last release of the 0.5 line
        run: git worktree add --detach "$RUNNER_TEMP/release-0.5" "refs/tags/$LAST_05_RELEASE"
      # The RNL skill package, for agents: site/dist/skill/rnl-skill.zip, the files of the package as plain
      # text under site/dist/skill/rnl/, a manifest and the hashes, and the plain-text entry that agents look
      # for, site/dist/llms.txt, in English only, which the page for agents,
      # agents.html, links. Both are the tag's, built by the tag's own script, so that the package of the
      # language 0.3 stays published while main's skills/rnl moves on; main's package is checked by skill.yml.
      - name: Build the skill package for agents
        working-directory: ${{ runner.temp }}/release-0.5
        run: python3 scripts/skill/build.py --site "$GITHUB_WORKSPACE/site/dist"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The core of the release LAST_05_RELEASE: its command line for Linux, and its npm package
      # @rich-netlist/runtime, the core as WebAssembly, each checked against the release's SHA256SUMS.txt (the npm
      # package is the same file as the release's rich-netlist-runtime-X.Y.Z.tgz). RNL_BIN, which scripts/brand.mjs
      # reads too, names the command line, and RNL_GALLERY_CORE the package, which site/gallery/build.mjs draws with.
      - name: Download the core of the last release of the 0.5 line
        run: |
          core="$RUNNER_TEMP/core-0.5"
          version="${LAST_05_RELEASE#core-v}"
          mkdir -p "$core/bin"
          cd "$core"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$LAST_05_RELEASE"
          curl -fsSL --retry 3 -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          curl -fsSL --retry 3 -o rnl-x86_64-unknown-linux-musl.tar.gz "$base/rnl-x86_64-unknown-linux-musl.tar.gz"
          npm pack "@rich-netlist/runtime@$version" --silent
          grep -E " \*?(rnl-x86_64-unknown-linux-musl\.tar\.gz|rich-netlist-runtime-$version\.tgz)$" SHA256SUMS.txt | sed 's/ \*/  /' > check.txt
          test "$(wc -l < check.txt)" -eq 2
          sha256sum -c check.txt
          tar -xzf rnl-x86_64-unknown-linux-musl.tar.gz -C bin
          tar -xzf "rich-netlist-runtime-$version.tgz"
          rnl="$(find "$core/bin" -type f -name rnl | head -n 1)"
          "$rnl" --version | grep -q "^rnl $version "
          test -f package/rnl_runtime_wasm.wasm
          echo "RNL_BIN=$rnl" >> "$GITHUB_ENV"
          echo "RNL_GALLERY_CORE=$core/package" >> "$GITHUB_ENV"
      - name: Check and render the site's example netlists
        run: python3 site/build.py --check --rnl "$RNL_BIN"

      # The web viewer at viewer/, one copy for every language: the core as WebAssembly, the page of
      # apps/viewer-ui with its web fonts, and the conformance corpus as samples, as they are at the tag
      # LAST_05_RELEASE, built in the tag's checkout above with its own scripts, fonts and WebAssembly cache,
      # as the frozen viewer below is; main's web viewer is tested by web.yml.
      - name: Install Rust with the WebAssembly target
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Writing the web fonts from the pinned fonts takes scripts/fonts.py a minute or two, and what it
      # writes changes only with the tag, so it is kept between runs.
      - id: fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-0.5/apps/viewer-ui/fonts/
          key: web-fonts-viewer-${{ env.LAST_05_RELEASE }}
      - if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # downloads the pinned fonts and writes apps/viewer-ui/fonts/, the drawing's web fonts
      - name: Write the web fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/release-0.5
        run: pip install fonttools brotli && python scripts/fonts.py web
      # the crates the core depends on, and what was built of them for WebAssembly
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ runner.temp }}/viewer-target/
          key: pages-viewer-wasm-${{ steps.rust.outputs.version }}-${{ env.LAST_05_RELEASE }}
      # writes apps/web/dist/, including libraries/*.rnl, index.json and bundled.json,
      # and puts it at site/dist/viewer/, where the pages of every language link
      - name: Build the web viewer, with samples and the package library
        working-directory: ${{ runner.temp }}/release-0.5
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/viewer-target
        run: |
          node apps/web/build.mjs --samples
          cp -r apps/web/dist "$GITHUB_WORKSPACE/site/dist/viewer"

      # The frozen viewer for 0.3 files, site/dist/viewer-0.3/: the web viewer as it was at the tag
      # FROZEN_VIEWER_TAG, with its own page, core and WebAssembly, and a banner that says it is the old
      # viewer and links ../viewer/ (apps/web/freeze.mjs). The tag is checked out beside the workspace and
      # built there, as the viewer above is, with its own fonts and its own WebAssembly cache.
      - name: Check out the tag of the frozen viewer
        run: git worktree add --detach "$RUNNER_TEMP/frozen-viewer" "refs/tags/$FROZEN_VIEWER_TAG"
      - id: frozen-fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/frozen-viewer/apps/viewer-ui/fonts/
          key: web-fonts-frozen-${{ env.FROZEN_VIEWER_TAG }}
      - if: steps.frozen-fonts.outputs.cache-hit != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Write the web fonts of the frozen viewer
        if: steps.frozen-fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/frozen-viewer
        run: pip install fonttools brotli && python scripts/fonts.py web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/frozen-target/
          key: pages-frozen-wasm-${{ steps.rust.outputs.version }}-${{ env.FROZEN_VIEWER_TAG }}
      - name: Build the frozen viewer for 0.3 files
        working-directory: ${{ runner.temp }}/frozen-viewer
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/frozen-target
        run: |
          node apps/web/build.mjs --samples
          # (the banner is main's: the tag's page gets nothing of the tag's own but what it was)
          node "$GITHUB_WORKSPACE/apps/web/freeze.mjs" apps/web/dist --link ../viewer/
          cp -r apps/web/dist "$GITHUB_WORKSPACE/site/dist/viewer-0.3"
      - name: Check the frozen viewer
        run: |
          test -f site/dist/viewer-0.3/index.html
          test -f site/dist/viewer-0.3/frozen-banner.js
          grep -q 'frozen-banner.js' site/dist/viewer-0.3/index.html
          test -f site/dist/viewer-0.3/core/rnl_runtime_wasm.wasm
          test -f site/dist/viewer/core/rnl_runtime_wasm.wasm
          test ! -f site/dist/viewer/frozen-banner.js

      # The data of the gallery of the standard packages (packages.html), which the pages of both
      # languages load: every package file in libraries/ read, and every symbol drawn by the core of
      # LAST_05_RELEASE (RNL_GALLERY_CORE, above), written into site/dist/gallery/. The tests of
      # its reading of package files run first.
      - name: Build the gallery of the standard packages
        run: |
          node --test site/gallery/package-file.test.mjs site/gallery/public-packages.test.mjs site/gallery/released.test.mjs site/gallery/frozen.test.mjs
          node site/gallery/build.mjs

      - name: Use the locked offline catalog for browser tests
        run: |
          python scripts/packages.py fixture
          echo "RNL_PACKAGE_CATALOG=$GITHUB_WORKSPACE/.rnl-packages/fixture/catalog.json" >> "$GITHUB_ENV"
      # The browsers and their system packages (--with-deps, about 120 MB for WebKit): cached, with a time limit
      # and one retry from another mirror, as the Ubuntu mirror was slow for 15 to 50 minutes in several runs
      # on 2026-10-23, 24 and 26, in bursts that apt's own timeouts do not catch.
      - name: Install the dependencies of the browser tests
        run: npm ci --prefix tests/viewer
      - name: Install the browsers for the site checks
        timeout-minutes: 25
        uses: ./.github/actions/install-playwright
        with:
          working-directory: tests/viewer
      # Normally about 5 minutes.
      - name: Check site navigation in Chromium and WebKit
        timeout-minutes: 25
        env:
          RNL_SITE_SCREENSHOTS: ${{ runner.temp }}/package-review
          RNL_I18N_SCREENSHOTS: ${{ runner.temp }}/package-review/language-menu
          RNL_MACOS_SCREENSHOTS: ${{ runner.temp }}/package-review/macos
          RNL_TIMELINE_SCREENSHOTS: ${{ runner.temp }}/package-review/timeline
        run: |
          node --test scripts/brand.test.mjs
          node tests/viewer/node_modules/@playwright/test/cli.js test --config site/playwright.config.mjs

      - name: Keep bilingual light and dark review screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-package-review-screenshots
          path: ${{ runner.temp }}/package-review
          if-no-files-found: error

      - name: Restore production gallery from the latest catalog
        env:
          RNL_PACKAGE_CATALOG: https://rich-netlist.github.io/rnl-packages/catalog.json
        run: node site/gallery/build.mjs

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

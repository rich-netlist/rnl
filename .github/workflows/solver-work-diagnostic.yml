name: Frozen optimized candidate

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      build_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: solver-performance-optimized
  cancel-in-progress: false

jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"
      RUST_TOOLCHAIN: "1.97.1-x86_64-pc-windows-gnu"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Require one immutable public candidate
        shell: pwsh
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full public commit SHA' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rich-netlist/rnl
          ref: ${{ inputs.candidate_sha }}
          path: source-work
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Select fresh diagnostic paths
        shell: pwsh
        run: |
          if (Test-Path "$env:RUNNER_TEMP/solver-work-build") { throw 'Work target must be fresh' }
          if (Test-Path "$env:RUNNER_TEMP/solver-work-diagnostic") { throw 'Work artifact must be new' }
          "ARTIFACT=$env:RUNNER_TEMP/solver-work-diagnostic" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify the single-command wrapper without native execution
        if: ${{ !inputs.build_only }}
        shell: pwsh
        run: |
          python harness/scripts/solver-performance/test_work.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python harness/scripts/solver-performance/benchmark.py --fixtures harness/tests/performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify owned cleanup with synthetic processes
        if: ${{ !inputs.build_only }}
        shell: pwsh
        run: |
          python harness/scripts/solver-performance/test_benchmark.py --owned-helper-fixture "$env:ARTIFACT/helper-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the frozen GNU toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = @('C:\msys64\mingw64\bin', 'C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin')
          $mingw = $paths | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
          if ($mingw) { $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Build only the candidate in a fresh target
        shell: pwsh
        run: python harness/scripts/solver-performance/ci_build.py --source source-work --source-head $env:CANDIDATE_SHA --output "$env:ARTIFACT/candidate" --target-dir "$env:RUNNER_TEMP/solver-work-build" --toolchain $env:RUST_TOOLCHAIN
      - name: Keep frozen fixture identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:ARTIFACT/fixtures" | Out-Null
          Copy-Item harness/tests/performance/manifest.json "$env:ARTIFACT/fixtures/manifest.json"
      - name: Run only M04 work once with an external 120 second cap
        if: ${{ !inputs.build_only }}
        shell: pwsh
        run: python harness/scripts/solver-performance/measure_work.py --fixtures harness/tests/performance --executable "$env:ARTIFACT/candidate/bin/rnl.exe" --build-info "$env:ARTIFACT/candidate/build-info.json" --source-head $env:CANDIDATE_SHA --output "$env:ARTIFACT/candidate/m04-work" --execute
      - name: Keep completed or partial evidence without retry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solver-${{ inputs.build_only && 'build' || 'm04-work' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solver-work-diagnostic/
          if-no-files-found: error
          retention-days: 14

# Builds the web viewer in apps/web: the core as WebAssembly with its JavaScript modules, and the page
# of apps/viewer-ui with the web shell and its web fonts, assembled into a static site; checks its
# scripts, and that the site is served with the MIME types a browser needs.
name: Web viewer

on:
  push:
    branches: [main]
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "i18n/**"
      - "scripts/i18n/viewer-locales.mjs"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "site/examples/**"
      - "brand/rnl-logo.sp"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "apps/web/**"
      - "apps/viewer-ui/**"
      - "i18n/**"
      - "scripts/i18n/viewer-locales.mjs"
      - "bindings/**"
      - "crates/**"
      - "libraries/**"
      - "scripts/fonts.py"
      - "site/examples/**"
      - "brand/rnl-logo.sp"
      - "tests/conformance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify locked public packages
        working-directory: ${{ github.workspace }}
        run: python scripts/packages.py download
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: Check the scripts
        run: |
          node --version
          find apps/web apps/viewer-ui bindings/runtime-wasm/js \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Install Python for the web fonts
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # downloads the pinned fonts and writes apps/viewer-ui/fonts/, the drawing's web fonts
      - name: Write the web fonts
        run: pip install fonttools brotli && python scripts/fonts.py web
      - name: Build the site, with the samples
        run: |
          node --test apps/web/build-info.test.mjs apps/web/preload-hints.test.mjs apps/web/library.test.mjs apps/web/edits.test.mjs apps/web/constraint-box.test.mjs apps/web/public-packages.test.mjs apps/web/zip.test.mjs apps/web/manifest-copy.test.mjs bindings/runtime-wasm/tests/manifest.test.mjs
          node apps/web/build.mjs --samples
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; import {buildVersions} from "./apps/web/build-info.mjs"; const about=JSON.parse(readFileSync("apps/web/dist/about.json")); const expected=buildVersions(process.cwd()); assert.equal(about.version,expected.version); assert.equal(about.coreVersion,expected.coreVersion); assert.match(about.commit,/^[0-9a-f]+$/); console.log(about);'
      - name: Serve the site
        run: |
          node apps/web/serve.mjs --port 8000 &
          served() { curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null -w '%{content_type}' "http://127.0.0.1:8000/$1"; }
          test "$(served)" = "text/html; charset=utf-8"
          test "$(served shells/web.js)" = "text/javascript; charset=utf-8"
          test "$(served core/worker.js)" = "text/javascript; charset=utf-8"
          test "$(served core/rnl_runtime_wasm.wasm)" = "application/wasm"
          test "$(served commands.json)" = "application/json"
          test "$(served style.css)" = "text/css; charset=utf-8"
          test "$(served embed.css)" = "text/css; charset=utf-8"
          test "$(served embed-demo.html)" = "text/html; charset=utf-8"
          test "$(served embed-demo.js)" = "text/javascript; charset=utf-8"
          test "$(served fonts/fonts.css)" = "text/css; charset=utf-8"
          test "$(served fonts/noto-sans-sc-400-latin.woff2)" = "font/woff2"
          test "$(served samples/cases/04-hierarchy-lib.inc)" = "application/octet-stream"
          test "$(served samples/site/ota5t.sp)" = "application/octet-stream"
          test "$(served samples/brand/rnl-logo.sp)" = "application/octet-stream"
          if curl -fs -o /dev/null http://127.0.0.1:8000/shells/desktop.js; then echo "the desktop shell is in the site"; exit 1; fi

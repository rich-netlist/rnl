# Tests the viewers' shared page in apps/viewer-ui in Chromium, Firefox and WebKit with Playwright,
# against a fake shell that serves Documents the rnl command built natively, and smoke-tests the web
# viewer of apps/web, its site built with the core as WebAssembly (tests/viewer).
name: Viewer page

on:
  push:
    branches: [main]
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "apps/viewer-ui/**"
      - "apps/web/**"
      - "bindings/**"
      - "tests/viewer/**"
      - "tests/conformance/**"
      - "crates/**"
      - "libraries/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/viewer.yml"
  pull_request:
    paths:
      - "packages.lock.json"
      - "scripts/packages*"
      - "apps/viewer-ui/**"
      - "apps/web/**"
      - "bindings/**"
      - "tests/viewer/**"
      - "tests/conformance/**"
      - "crates/**"
      - "libraries/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify locked public packages
        working-directory: ${{ github.workspace }}
        run: python scripts/packages.py download
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Playwright
        run: npm ci
      - name: Install the browsers and what they need
        run: npx playwright install --with-deps chromium webkit
      - name: Write the pinned fonts and isolate system font coverage
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install fonttools==4.58.0 brotli==1.2.0
          python scripts/fonts.py web
          echo "FONTCONFIG_FILE=$GITHUB_WORKSPACE/apps/desktop/tests/fontconfig-no-cjk.conf" >> "$GITHUB_ENV"
          echo "RNL_NO_SYSTEM_CJK=1" >> "$GITHUB_ENV"
          FONTCONFIG_FILE="$GITHUB_WORKSPACE/apps/desktop/tests/fontconfig-no-cjk.conf" fc-list :lang=zh | tee "$RUNNER_TEMP/system-cjk-fonts.txt"
          test ! -s "$RUNNER_TEMP/system-cjk-fonts.txt"
      # the web server builds the web viewer's site and serves it; the global setup builds the rnl
      # command and writes the fixtures
      - name: Test the page and the web viewer in Chromium, Firefox and WebKit
        run: npx playwright test --project chromium --project webkit --workers 2
      - name: Keep browser evidence and font transfer sizes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-page-report
          path: |
            tests/viewer/playwright-report/
            tests/viewer/test-results/
          retention-days: 14

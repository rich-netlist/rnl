# Keep this filename: npm's OIDC trusted publisher is bound to publish-runtime.yml.
name: Publish runtime
on:
  push:
    tags: ["core-v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/core-release.yml
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rnl-core-${{ needs.build.outputs.version }}
          path: assets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require the maintainer's dist-tag decision and verify all files
        env:
          DIST_TAG: ${{ vars.CORE_NPM_DIST_TAG }}
        run: |
          case "$DIST_TAG" in next|latest) ;; *) echo '::error::Set CORE_NPM_DIST_TAG to next or latest after the release decision.'; exit 1 ;; esac
          (cd assets && sha256sum --check SHA256SUMS.txt)
      - name: Install the pinned trusted-publishing npm
        run: npm install --global npm@11.21.0
      - name: Publish by trusted publishing
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ vars.CORE_NPM_DIST_TAG }}
        run: npm publish "./assets/rich-netlist-runtime-$VERSION.tgz" --access public --tag "$DIST_TAG" --provenance
  smoke:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify the smoke test's locked public packages
        run: python scripts/packages.py download
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the packages of the smoke test
        working-directory: packages/runtime/smoke
        run: npm ci --no-audit --no-fund
      # The browser and its system packages: cached, with a time limit and one retry from another mirror
      # (the Ubuntu mirror stalled for most of an hour several times on 2026-10-23, 24 and 26).
      - name: Install the browser for the smoke test
        timeout-minutes: 25
        uses: ./.github/actions/install-playwright
        with:
          working-directory: packages/runtime/smoke
          browsers: chromium
      - name: Smoke-test the published package
        working-directory: packages/runtime/smoke
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node smoke.mjs "@rich-netlist/runtime@$VERSION"
  release:
    needs: [build, publish, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rnl-core-${{ needs.build.outputs.version }}
          path: assets
      - name: Publish RNL core as the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd assets && sha256sum --check SHA256SUMS.txt)
          gh release create "core-v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "RNL core $VERSION" --notes-file "release-notes/core/$VERSION.md" --latest --verify-tag

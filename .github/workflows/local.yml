# Tests the local viewer in apps/local: the program that serves the web viewer on the loopback address, with the web viewer in
# it. Its unit tests (HTTP, security, the folders it allows, saving, the solver), and the page against the program in Chromium and
# WebKit: the netlist named on the command line, Save, a change on disk, Solve, the file chooser, the settings, and that nothing is
# served without the session.
name: Local viewer

on:
  push:
    branches: [main]
    paths:
      - "apps/local/**"
      - "apps/viewer-ui/**"
      - "apps/web/**"
      - "i18n/**"
      - "bindings/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/viewer/package*.json"
      - ".github/workflows/local.yml"
  pull_request:
    paths:
      - "apps/local/**"
      - "apps/viewer-ui/**"
      - "apps/web/**"
      - "bindings/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/viewer/package*.json"
      - ".github/workflows/local.yml"
  workflow_dispatch:

# A newer push to the same pull request cancels this run. A run on main or on a tag, and a manual,
# scheduled or called run, has a group of its own, so it is never cancelled or held back.
concurrency:
  group: local-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify locked public packages
        run: python scripts/packages.py download
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install Playwright
        working-directory: tests/viewer
        run: npm ci
      - name: Install the browsers and what they need
        timeout-minutes: 25
        uses: ./.github/actions/install-playwright
        with:
          working-directory: tests/viewer
      - name: Write the web fonts
        run: pip install fonttools==4.58.0 brotli==1.2.0 && python scripts/fonts.py web
      - name: Build the web viewer
        run: node apps/web/build.mjs --no-solver
      - name: Test the program
        working-directory: apps/local
        env:
          RNL_SITE_DIR: ${{ github.workspace }}/apps/web/dist
        run: |
          cargo test
          cargo build
      - name: Test the page against the program, in Chromium and WebKit
        working-directory: apps/local
        env:
          RNL_LOCAL_BIN: ${{ github.workspace }}/apps/local/target/debug/rnl-viewer-local
        run: npx --prefix ../../tests/viewer playwright test --config playwright.config.mjs --project chromium --project webkit
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-viewer-report
          path: apps/local/test-results/
          retention-days: 14
          if-no-files-found: ignore

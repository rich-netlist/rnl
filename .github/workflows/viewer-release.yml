# Builds the desktop viewer of apps/desktop for Windows and Linux and releases it: on Windows, a single
# executable, an NSIS installer for the current user and an MSI for the machine. The Tauri command
# line that apps/desktop/package.json pins builds them on GitHub's Windows runner, whose MSVC
# toolchain links the WebView2 loader into the executable. The workflow checks that the executable
# imports no WebView2Loader.dll, smoke-tests it alone in a directory, and installs both installers,
# smoke-tests the installed app and uninstalls it. A pushed tag viewer-v<version>, the app's version,
# then makes the GitHub release "RNL Viewer <version>" with the notes of
# apps/desktop/release-notes/<version>.md, not marked as the repository's latest release, which stays
# the core's. Run by hand, it only builds and keeps the files as the run's artifact.
name: Viewer release

on:
  push:
    tags: ["viewer-v*"]
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Optional viewer-vX.Y.Z to validate without pushing a tag (never publishes)"
        type: string
        default: ""
      measure_font_sizes:
        description: "Also rebuild without the UI font fallback to measure package size differences"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject mismatched versions before either build
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          tag="$CANDIDATE_TAG"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          args=()
          if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          python scripts/release.py validate viewer --require-notes "${args[@]}"
  build:
    needs: validate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the version of tauri.conf.json, which the installers carry, must be the crate's, and a tag's
      - name: The version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $crate = (Select-String -Path apps/desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($crate -ne $version) { throw "apps/desktop/Cargo.toml has version $crate, tauri.conf.json $version." }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -ne "viewer-v$version") { throw "The tag $env:GITHUB_REF_NAME is not the app's version, $($version)." }
            $notes = "apps/desktop/release-notes/$version.md"
            if (-not (Test-Path $notes)) { throw "The release has no notes in $notes." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(([string]$version.Contains('-')).ToLower())" >> $env:GITHUB_OUTPUT
          "RNL Viewer $version"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # downloads the pinned fonts and writes apps/viewer-ui/fonts/, the drawing's web fonts, which
      # the app embeds; fontTools and brotli are pinned, so that a release's fonts can be made again
      - name: Write the web fonts
        run: |
          pip install fonttools==4.58.0 brotli==1.2.0
          python scripts/fonts.py web
      - name: Install the Tauri command line
        working-directory: apps/desktop
        run: npm ci
      # cargo build --release with Tauri's custom-protocol feature, as for production, then the
      # installers, for which the bundler downloads NSIS and WiX
      - name: Build the app and its installers
        working-directory: apps/desktop
        run: npx tauri build

      # dumpbin lists the imports; the Visual Studio installer's vswhere finds it
      - name: The executable does not import WebView2Loader.dll
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "There is no dumpbin." }
          $imports = & $dumpbin /nologo /imports apps\desktop\target\release\rnl-viewer.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed." }
          $dlls = @($imports | Where-Object { $_ -match '^\s+(\S+\.dll)$' } | ForEach-Object { $Matches[1] } | Sort-Object -Unique)
          "rnl-viewer.exe imports $($dlls -join ', ')"
          if ($dlls -notcontains "kernel32.dll") { throw "dumpbin listed no imports." }
          if ($dlls -contains "WebView2Loader.dll") { throw "rnl-viewer.exe imports WebView2Loader.dll, so it is no single file." }

      # names without spaces, and their SHA-256 sums
      - name: The release's files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\assets"
          $name = "RNL-Viewer-$env:VERSION-windows-x64"
          $built = "apps\desktop\target\release"
          Copy-Item "$built\bundle\nsis\RNL Viewer_$($env:VERSION)_x64-setup.exe" "$out\$name-setup.exe"
          Copy-Item "$built\bundle\msi\RNL Viewer_$($env:VERSION)_x64_en-US.msi" "$out\$name.msi"
          Copy-Item "$built\rnl-viewer.exe" "$out\$name.exe"
          $sums = Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$out\SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-ChildItem $out | Format-Table Name, Length -AutoSize
          Get-Content "$out\SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rnl-viewer-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 14

      # Windows 10 and 11 come with the runtime that the app runs on, the runner's Windows Server need not
      - name: Install the WebView2 Runtime if there is none
        timeout-minutes: 10
        run: node apps/desktop/tests/webview2.mjs --install
      # each starts the app on tests/conformance/cases/04-hierarchy.sp and drives it through WebView2's
      # DevTools port; alone in a directory, the executable shows that it needs no file beside it
      - name: Smoke-test the single executable
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/single"
          cp "$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-windows-x64.exe" "$RUNNER_TEMP/single/"
          node apps/desktop/tests/smoke.mjs --exe "$RUNNER_TEMP/single/RNL-Viewer-$VERSION-windows-x64.exe"
      - name: Install with the NSIS installer for the user, smoke-test the app and uninstall it
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node apps/desktop/tests/installers.mjs --nsis "$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-windows-x64-setup.exe"
      # the runner is an administrator, as the MSI's installation for the machine needs
      - name: Install the MSI for the machine, smoke-test the app and uninstall it
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node apps/desktop/tests/installers.mjs --msi "$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-windows-x64.msi"
      - name: Measure the Windows font-fix package sizes
        if: inputs.measure_font_sizes
        env:
          FONT_SIZE_ASSETS: ${{ runner.temp }}/assets
          FONT_SIZE_OUTPUT: ${{ runner.temp }}/font-sizes/windows.json
        run: node apps/desktop/tests/font-sizes.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.measure_font_sizes
        with:
          name: viewer-font-sizes-windows
          path: ${{ runner.temp }}/font-sizes/
          if-no-files-found: error

  build-linux:
    needs: validate
    # Build on the oldest supported Ubuntu, so the AppImage also runs on newer glibc systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The version
        id: version
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          app = Path('apps/desktop')
          version = json.loads((app / 'tauri.conf.json').read_text())['version']
          crate = re.search(r'^version = "(.+)"', (app / 'Cargo.toml').read_text(), re.M)[1]
          assert crate == version, f'Crate version {crate} differs from {version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'viewer-v{version}', 'Tag differs from app version'
              assert (app / f'release-notes/{version}.md').is_file(), 'Release notes are missing'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'version={version}', file=out)
          PY
      - name: Install the Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev fonts-dejavu-core patchelf libfuse2 webkit2gtk-driver xvfb xdotool dbus-x11 imagemagick
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Write the web fonts
        run: |
          pip install fonttools==4.58.0 brotli==1.2.0
          python scripts/fonts.py web
      - name: Install the Tauri command line
        working-directory: apps/desktop
        run: npm ci
      - name: Build the AppImage and Debian package
        working-directory: apps/desktop
        env:
          # linuxdeploy's own AppImage can extract itself on runners without a FUSE mount.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles appimage,deb
      - name: The Linux release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          built=apps/desktop/target/release/bundle
          cp "$built/appimage/RNL Viewer_${VERSION}_amd64.AppImage" "$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-linux-x86_64.AppImage"
          cp "$built/deb/RNL Viewer_${VERSION}_amd64.deb" "$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-linux-x86_64.deb"
          chmod +x "$RUNNER_TEMP/assets/"*.AppImage
          cd "$RUNNER_TEMP/assets"
          sha256sum RNL-Viewer-* > SHA256SUMS.txt
      - name: Smoke-test the AppImage in its own directory
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FONTCONFIG_FILE: ${{ github.workspace }}/apps/desktop/tests/fontconfig-no-cjk.conf
          RNL_NO_SYSTEM_CJK: "1"
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/smoke-linux
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/single"
          cp "$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-linux-x86_64.AppImage" "$RUNNER_TEMP/single/"
          dbus-run-session -- xvfb-run -a node apps/desktop/tests/linux-smoke.mjs --exe "$RUNNER_TEMP/single/RNL-Viewer-$VERSION-linux-x86_64.AppImage"
      - name: Install the Debian package, smoke-test it and uninstall it
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FONTCONFIG_FILE: ${{ github.workspace }}/apps/desktop/tests/fontconfig-no-cjk.conf
          RNL_NO_SYSTEM_CJK: "1"
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/smoke-linux
        run: |
          deb="$RUNNER_TEMP/assets/RNL-Viewer-$VERSION-linux-x86_64.deb"
          package=$(dpkg-deb --field "$deb" Package)
          trap 'sudo apt-get remove -y "$package"' EXIT
          sudo apt-get install -y "$deb"
          test -f "/usr/share/applications/RNL Viewer.desktop"
          dbus-run-session -- xvfb-run -a node apps/desktop/tests/linux-smoke.mjs --exe /usr/bin/rnl-viewer
          sudo apt-get remove -y "$package"
          trap - EXIT
          test ! -e /usr/bin/rnl-viewer
          test ! -e "/usr/share/applications/RNL Viewer.desktop"
      - name: Measure the Linux font-fix package sizes
        if: inputs.measure_font_sizes
        env:
          FONT_SIZE_ASSETS: ${{ runner.temp }}/assets
          FONT_SIZE_OUTPUT: ${{ runner.temp }}/smoke-linux/linux-font-sizes.json
        run: node apps/desktop/tests/font-sizes.mjs
      - name: Keep the Linux smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rnl-viewer-linux-smoke
          path: ${{ runner.temp }}/smoke-linux/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rnl-viewer-${{ steps.version.outputs.version }}-linux-x86_64
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 14

  assets:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rnl-viewer-${{ needs.build.outputs.version }}-*
          path: incoming
      - name: Verify both platforms and combine their checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir assets
          for platform in windows-x64 linux-x86_64; do
            dir="incoming/rnl-viewer-$VERSION-$platform"
            (cd "$dir" && sha256sum --check SHA256SUMS.txt)
            find "$dir" -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec cp {} assets/ \;
          done
          cd assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum RNL-Viewer-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rnl-viewer-${{ needs.build.outputs.version }}
          path: assets/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rnl-viewer-${{ needs.build.outputs.version }}
          path: assets
      - name: Check the files against their sums
        working-directory: assets
        run: sha256sum --check SHA256SUMS.txt
      # --latest=false: the repository's latest release belongs to the core, so anything
      # that looks for the newest viewer filters the releases by the tag's prefix, as Help > Check
      # for Updates does
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "viewer-v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RNL Viewer $VERSION" \
            --notes-file "apps/desktop/release-notes/$VERSION.md" \
            --latest=false \
            --verify-tag \
            "${flags[@]}"

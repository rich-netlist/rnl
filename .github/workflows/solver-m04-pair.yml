name: Fixed M04 prototype pair

on:
  workflow_call:
    inputs:
      baseline_sha:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true
      tool_sha:
        type: string
        required: true
      authorization_token:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: solver-performance-optimized
  cancel-in-progress: false

jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "4"
      RUST_TOOLCHAIN: "1.97.1-x86_64-pc-windows-gnu"
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      TOOL_SHA: ${{ inputs.tool_sha }}
      AUTHORIZATION_TOKEN: ${{ inputs.authorization_token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tool_sha }}
          path: harness
          persist-credentials: false
      - name: Require immutable public source commits
        shell: pwsh
        run: |
          if ($env:BASELINE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'baseline_sha must be a full public commit SHA' }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full public commit SHA' }
          if ($env:TOOL_SHA -notmatch '^[0-9a-f]{40}$' -or $env:TOOL_SHA -ne '${{ github.sha }}') { throw 'tool_sha must equal the dispatch commit' }
          if ($env:AUTHORIZATION_TOKEN -notmatch '^M04-[A-Za-z0-9_-]{8,100}$') { throw 'Explicit root execution token required' }
          if ('${{ github.run_attempt }}' -ne '1') { throw 'Reruns are forbidden; account for any earlier starts before a new authorization' }
          if ($env:CANDIDATE_SHA -eq $env:BASELINE_SHA) { throw 'Do not measure the same product revision twice' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rich-netlist/rnl
          ref: ${{ inputs.baseline_sha }}
          path: source-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rich-netlist/rnl
          ref: ${{ inputs.candidate_sha }}
          path: source-head
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set the isolated artifact directory
        shell: pwsh
        run: |
          "ARTIFACT=$env:RUNNER_TEMP/solver-m04-pair-artifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FIXTURES=$env:RUNNER_TEMP/solver-fixtures" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preserve the dispatch authorization before building or solving
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(os.environ['ARTIFACT'])
          root.mkdir(parents=True, exist_ok=False)
          receipt = {key: os.environ.get(key) for key in ('BASELINE_SHA', 'CANDIDATE_SHA', 'TOOL_SHA', 'AUTHORIZATION_TOKEN', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_NAME')}
          receipt.update(maximum_solver_starts=10, external_cap_seconds=10, no_retry=True)
          (root/'authorization.json').write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
      - name: Extract pinned packages and generate frozen inputs
        shell: python
        run: |
          import json, os, subprocess, sys
          manifest = json.load(open('harness/tests/performance/manifest.json', encoding='utf-8'))
          for source in ('historical_source', 'library_source'):
              subprocess.run(['git', '-C', 'harness', 'fetch', '--no-tags', 'origin', manifest[source]['commit']], check=True)
          subprocess.run([sys.executable, 'harness/scripts/solver-performance/prepare_inputs.py', '--output', os.environ['FIXTURES']], check=True)
      - name: Verify policies
        shell: pwsh
        run: |
          python harness/scripts/solver-performance/test_benchmark.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python harness/scripts/solver-performance/test_pair.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify frozen fixture bytes
        shell: pwsh
        run: |
          python harness/scripts/solver-performance/benchmark.py --fixtures $env:FIXTURES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify owned-process cleanup before any solver dispatch
        shell: pwsh
        run: |
          python harness/scripts/solver-performance/test_benchmark.py --owned-helper-fixture "$env:ARTIFACT/helper-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep exact selected inputs, packages and frozen identities
        shell: python
        run: |
          import json, os, pathlib, shutil
          source = pathlib.Path(os.environ['FIXTURES'])
          target = pathlib.Path(os.environ['ARTIFACT'])/'fixtures'
          target.mkdir()
          shutil.copy2(source/'manifest.json', target/'manifest.json')
          shutil.copy2('harness/tests/performance/canonical-main.json', target/'canonical-main.json')
          shutil.copytree(source/'library', target/'library')
          manifest = json.loads((source/'manifest.json').read_text())
          names = ('04-fd-ota-cmfb.sp', 'T4-miller-conflicts.sp', '15-pfd-charge-pump.sp')
          for item in manifest['representative']:
              if pathlib.Path(item['input']).name in names:
                  output = target/item['input']
                  output.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source/item['input'], output)
      - name: Install the fixed GNU Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = @('C:\msys64\mingw64\bin', 'C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin')
          $mingw = $paths | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
          if ($mingw) { $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      # All compilation finishes before the first measured solver command.
      - name: Build the frozen baseline (optimized, jobs=4)
        shell: pwsh
        run: python harness/scripts/solver-performance/ci_build.py --source source-base --source-head $env:BASELINE_SHA --output "$env:ARTIFACT/baseline" --target-dir "${{ runner.temp }}/solver-build-base" --toolchain $env:RUST_TOOLCHAIN
      - name: Build the frozen candidate (optimized, jobs=4)
        shell: pwsh
        run: python harness/scripts/solver-performance/ci_build.py --source source-head --source-head $env:CANDIDATE_SHA --output "$env:ARTIFACT/candidate" --target-dir "${{ runner.temp }}/solver-build-head" --toolchain $env:RUST_TOOLCHAIN
      - name: Make verified optimized binaries available before measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solver-m04-pair-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/solver-m04-pair-artifact/**/bin/rnl.exe
            ${{ runner.temp }}/solver-m04-pair-artifact/**/build-info.json
            ${{ runner.temp }}/solver-m04-pair-artifact/**/build-command.json
            ${{ runner.temp }}/solver-m04-pair-artifact/**/build-resources.json
            ${{ runner.temp }}/solver-m04-pair-artifact/authorization.json
          if-no-files-found: error
          retention-days: 14
      - name: Run only the authorized fixed pair queue, externally capped at ten seconds
        shell: pwsh
        run: python harness/scripts/solver-performance/measure_pair.py --fixtures $env:FIXTURES --artifact $env:ARTIFACT --baseline-sha $env:BASELINE_SHA --candidate-sha $env:CANDIDATE_SHA --tool-sha $env:TOOL_SHA --authorization-token $env:AUTHORIZATION_TOKEN --execute
      - name: Keep optimized EXEs, build identities and all measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solver-m04-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solver-m04-pair-artifact/
          if-no-files-found: error
          retention-days: 14

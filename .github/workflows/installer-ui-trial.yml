# TRIAL, for the branch claude/desktop-bundled-packages only; deleted before it is merged. Pictures of the pages
# of the Windows installers where the public packages are chosen (apps/desktop/tests/installer-ui.ps1), taken from
# the Windows files of the last successful run of viewer-release.yml on the branch, so that the script can be tried
# without building the viewer again. A push of the script or of this file runs it (a new workflow cannot be
# dispatched before it is on the default branch).
name: Installer pages (trial)

on:
  push:
    branches: [claude/desktop-bundled-packages]
    paths:
      - "apps/desktop/tests/installer-ui.ps1"
      - ".github/workflows/installer-ui-trial.yml"

permissions:
  contents: read
  actions: read

jobs:
  pictures:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The installers of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow viewer-release.yml --branch claude/desktop-bundled-packages --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "the files of run $RUN_ID"
          version=$(python -c "import json; print(json.load(open('apps/desktop/tauri.conf.json'))['version'])")
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "rnl-viewer-$version-windows-x64" -D "$RUNNER_TEMP/assets"
          ls -la "$RUNNER_TEMP/assets"
      - name: Pictures of the installers' pages
        timeout-minutes: 12
        continue-on-error: true
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File apps/desktop/tests/installer-ui.ps1 \
            -Nsis "$(ls "$RUNNER_TEMP"/assets/*-setup.exe)" \
            -Msi "$(ls "$RUNNER_TEMP"/assets/*.msi)" \
            -Out "$RUNNER_TEMP/installer-ui"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rnl-viewer-installer-ui
          path: ${{ runner.temp }}/installer-ui/
          if-no-files-found: warn
          retention-days: 14

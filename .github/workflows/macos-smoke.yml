# Repeat native observation against an exact retained DMG; no rebuild, tag, release or Pages trigger.
name: Mac viewer smoke
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Viewer release run containing the macos-arm64 artifact to observe"
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The version
        id: version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("apps/desktop/tauri.conf.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rnl-viewer-${{ steps.version.outputs.version }}-macos-arm64
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Verify and install the exact retained DMG
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.release_run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/installed" "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/smoke"
          gh run view "$REUSE_RUN" --json headSha,url > "$RUNNER_TEMP/smoke/binary-source.json"
          (cd incoming && shasum -a 256 --check SHA256SUMS.txt)
          printf 'Y\n' | hdiutil attach incoming/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/dmg"' EXIT
          ditto "$RUNNER_TEMP/dmg/RNL Viewer.app" "$RUNNER_TEMP/installed/RNL Viewer.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          trap - EXIT
      - name: Observe with the current smoke script
        env:
          SMOKE_OUTPUT_DIR: ${{ runner.temp }}/smoke
        run: node apps/desktop/tests/macos-smoke.mjs --app "$RUNNER_TEMP/installed/RNL Viewer.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-native-observation
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: error
          retention-days: 14

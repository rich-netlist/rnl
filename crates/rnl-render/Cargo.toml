[package]
name = "rnl-render"
description = "Shared Rich Netlist (RNL) renderer: effective model to basic primitives and SVG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# the code under MIT, and the metrics of the fonts it lays out text with, fonts/noto-sans-sc.metrics,
# under the fonts' licence (decision 0007)
license = "MIT AND OFL-1.1"
repository.workspace = true
publish.workspace = true

[dependencies]
rnl-runtime.workspace = true
serde_json.workspace = true
libm.workspace = true
# the characters the fonts do not map: split into grapheme clusters (UAX #29), and their widths
# estimated by the columns of UAX #11; tables in Rust, so native and WebAssembly builds agree
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false }

[package]
name = "rnl-solver"
description = "Solver of Rich Netlist (RNL) descriptions: resolves the geometric facts and places, orients and routes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rnl-runtime.workspace = true
# the widths of the texts, laid out with the renderer's own metrics of the shipped fonts, so that
# the boxes the solver keeps texts clear by are those drawn (quality review ST-7)
rnl-render.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
num-rational.workspace = true
num-traits.workspace = true

[dev-dependencies]
# reads the netlists of the tests, with the bundled packages
rnl-view.workspace = true

[package]
name = "rnl-view"
description = "The Rich Netlist (RNL) core interface: a workspace in, a Document out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rnl-runtime.workspace = true
rnl-host-spice.workspace = true
rnl-host-spectre.workspace = true
rnl-render.workspace = true
serde.workspace = true
# the snapshot's maps of roles and styles
serde_json.workspace = true

[dev-dependencies]
# exact floats when reading the JSON back in the tests
serde_json = { workspace = true, features = ["float_roundtrip"] }
# the TypeScript declarations in types/
ts-rs = "12.0.1"

<!DOCTYPE html>
<html lang="$html-lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="RNL standard publisher (pandoc $pandoc-version$)">
<meta name="rnl-revision" content="$revision$">
<title>$pagetitle$</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --panel: #f6f8fa;
  --accent: #0b57d0; --code-bg: #f6f8fa; --err: #b42318; --err-bg: #fef3f2;
  --k: #7c3aed; --i: #0f766e; --n: #b45309; --v: #1d4ed8; --d: #be185d; --r: #4d7c0f;
  --s: #15803d; --o: #57606a; --t: #8a9199; --c: #8a9199; --h: #57606a; --hi: #0f766e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --panel: #151b23;
    --accent: #6cb6ff; --code-bg: #151b23; --err: #ff8e85; --err-bg: #2d1416;
    --k: #c4a7ff; --i: #5eead4; --n: #fbbf24; --v: #93c5fd; --d: #f9a8d4; --r: #bef264;
    --s: #86efac; --o: #9ca3af; --t: #7d8590; --c: #7d8590; --h: #9ca3af; --hi: #5eead4;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 4.5rem; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.65 -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "DejaVu Sans Mono",
            "Microsoft YaHei", "Noto Sans Mono CJK SC", monospace; font-size: 0.88em; }
:not(pre) > code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.25em; }
pre.code, pre:not(.code) {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.7em 0.9em; overflow-x: auto; line-height: 1.5;
}
figure.code-error { margin: 1em 0; }
figure.code-error figcaption { font-size: 0.8em; font-weight: 600; color: var(--err); margin-bottom: 0.2em; }
figure.code-error pre { border-color: var(--err); background: var(--err-bg); }
.t-k { color: var(--k); font-weight: 600; } .t-i { color: var(--i); } .t-n { color: var(--n); }
.t-v { color: var(--v); } .t-d { color: var(--d); } .t-r { color: var(--r); } .t-s { color: var(--s); }
.t-o { color: var(--o); font-weight: 600; } .t-t { color: var(--t); font-style: italic; }
.t-c { color: var(--c); font-style: italic; } .t-h { color: var(--h); } .t-hi { color: var(--hi); }
table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1em 0; font-size: 0.93em; }
th, td { border: 1px solid var(--line); padding: 0.35em 0.6em; vertical-align: top; text-align: left; }
th { background: var(--panel); }

/* Layout: a bar on top, the contents beside the text on wide screens */
header.bar {
  position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 0.4em 1.2em; align-items: baseline;
  padding: 0.6em 1.2em; background: var(--bg); border-bottom: 1px solid var(--line);
}
header.bar .name { font-weight: 700; }
header.bar .rev { color: var(--muted); font-size: 0.85em; }
header.bar nav { margin-left: auto; font-size: 0.9em; display: flex; gap: 1em; flex-wrap: wrap; }
.layout { display: grid; grid-template-columns: 19rem minmax(0, 1fr); }
#toc {
  position: sticky; top: 3.2rem; align-self: start; max-height: calc(100vh - 3.2rem); overflow-y: auto;
  padding: 1em 1em 2em 1.2em; border-right: 1px solid var(--line); font-size: 0.86em; line-height: 1.45;
}
#toc ul { list-style: none; margin: 0; padding-left: 0; }
#toc ul ul { padding-left: 1em; margin: 0.15em 0 0.4em; }
#toc li { margin: 0.15em 0; }
#toc a { color: var(--fg); }
#toc a.here { color: var(--accent); font-weight: 600; }
#toc summary { display: none; }
main { max-width: 52rem; padding: 1.5em 2em 6em; }
main h1.title { font-size: 1.9em; margin: 0.3em 0 0.4em; }
main h1 { font-size: 1.55em; margin-top: 2em; padding-bottom: 0.2em; border-bottom: 1px solid var(--line); }
main h2 { font-size: 1.22em; margin-top: 1.8em; }
main h3 { font-size: 1.05em; margin-top: 1.5em; }
main h1 a.self, main h2 a.self, main h3 a.self { color: var(--muted); font-weight: 400; margin-left: 0.35em; visibility: hidden; }
main :is(h1, h2, h3):hover a.self { visibility: visible; }
@media (max-width: 900px) {
  html { scroll-padding-top: 0.5rem; }
  header.bar { position: static; }
  .layout { display: block; }
  #toc { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); padding: 0.6em 1.2em; }
  #toc summary { display: list-item; cursor: pointer; font-weight: 600; }
  main { padding: 1em 1.1em 5em; }
}
@media print {
  header.bar, #toc { display: none; }
  .layout { display: block; }
}
</style>
</head>
<body>
<header class="bar">
  <span class="name">$title$</span>
  <span class="rev">$revision-label$</span>
  <nav>
    <a href="$other-href$" data-keep-hash hreflang="$other-lang$">$other-label$</a>
    <a href="$pdf-href$">PDF</a>
    <a href="$md-href$">Markdown</a>
    <a href="$zip-href$">$zip-label$</a>
  </nav>
</header>
<div class="layout">
<details id="toc" open>
<summary>$contents-title$</summary>
$table-of-contents$
</details>
<main>
<h1 class="title">$title$</h1>
$body$
</main>
</div>
<script>
// The language switch keeps the reader at the same section; the contents mark the section in view.
document.querySelectorAll("a[data-keep-hash]").forEach(function (a) {
  a.addEventListener("click", function () { a.href = a.getAttribute("href").split("#")[0] + location.hash; });
});
if (window.matchMedia("(max-width: 900px)").matches) document.getElementById("toc").removeAttribute("open");
document.querySelectorAll("main section[id] > :is(h1, h2, h3)").forEach(function (h) {
  var a = document.createElement("a");
  a.className = "self"; a.href = "#" + h.parentElement.id; a.textContent = "#"; a.setAttribute("aria-label", "link");
  h.appendChild(a);
});
var tocLinks = {};
document.querySelectorAll("#toc a").forEach(function (a) { tocLinks[decodeURIComponent(a.hash.slice(1))] = a; });
var current = null;
var observer = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    var a = tocLinks[e.target.id];
    if (!a) return;
    if (current) current.classList.remove("here");
    current = a;
    a.classList.add("here");
  });
}, { rootMargin: "-10% 0px -80% 0px" });
document.querySelectorAll("main section[id]").forEach(function (s) { observer.observe(s); });
</script>
</body>
</html>

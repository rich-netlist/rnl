<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNL Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <button id="open" type="button" title="Open a netlist (Ctrl+O)">Open…</button>
  <button id="reload" type="button" title="Read the file again (F5)" disabled>Reload</button>
  <button id="fit" type="button" title="Fit the drawing in the window (F, or double-click)" disabled>Fit</button>
  <span id="file" class="file"></span>
  <nav id="levels" class="levels" aria-label="Drawing levels"></nav>
  <span id="zoom" class="zoom"></span>
</header>
<main id="canvas" class="canvas">
  <p id="empty" class="empty">Open a SPICE or Spectre netlist with RNL records (Ctrl+O).<br>Drag to move the view, scroll to zoom.</p>
</main>
<section id="panel" class="panel">
  <button id="panel-head" class="panel-head" type="button" aria-expanded="true" aria-controls="panel-body">
    <span class="chevron" aria-hidden="true"></span>
    <span class="panel-title">Problems</span>
    <span id="counts" class="counts"></span>
    <span id="status" class="status"></span>
  </button>
  <div id="panel-body" class="panel-body">
    <ul id="diags" class="diags"></ul>
  </div>
</section>
<script src="main.js"></script>
</body>
</html>

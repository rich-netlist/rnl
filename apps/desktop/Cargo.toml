[package]
name = "rnl-viewer"
version = "0.1.3"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Desktop viewer for Rich Netlist (RNL) documents"

# A workspace of its own: the WebView dependencies stay out of the library crates' builds.
[workspace]

# Keep local Viewer builds quick to link, but execute large RNL hierarchies with an optimized
# core. An unoptimized interpreter can take seconds per Library switch even with a warm index.
[profile.dev.package.rnl-runtime]
opt-level = 2

[profile.dev.package.rnl-view]
opt-level = 2

[profile.dev.package.rnl-render]
opt-level = 2

[profile.dev.package.rnl-host-spice]
opt-level = 2

[profile.dev.package.rnl-host-spectre]
opt-level = 2

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rnl-view = { path = "../../crates/rnl-view" }
rnl-cli = { path = "../../crates/rnl-cli" }
rnl-runtime = { path = "../../crates/rnl-runtime" }
rnl-solver = { path = "../../crates/rnl-solver" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

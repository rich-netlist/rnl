<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNL Viewer</title>
<link rel="stylesheet" href="style.css">
<!-- the drawing's fonts, if scripts/fonts.py web wrote them (decision 0009) -->
<link rel="stylesheet" href="fonts/fonts.css">
</head>
<body>
<nav id="menubar" class="menubar" role="menubar" aria-label="Menu bar" hidden></nav>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Side panel">
    <div class="side-head">
      <nav class="tabs view-tabs" role="tablist" aria-label="Side panel views">
        <button id="tab-netlist" type="button" role="tab" aria-controls="pane-netlist" aria-selected="true">Netlist</button>
        <button id="tab-hierarchy" type="button" role="tab" aria-controls="pane-hierarchy" aria-selected="false">Hierarchy</button>
        <button id="tab-unplaced" type="button" role="tab" aria-controls="pane-unplaced" aria-selected="false" title="The objects of the level shown that are not drawn: those with no position, and devices no symbol can be chosen for">Not drawn<span id="unplaced-tab-count" class="tab-count"></span></button>
        <button id="tab-solve" type="button" role="tab" aria-controls="pane-solve" aria-selected="false" hidden>Solve</button>
      </nav>
      <button id="hide-sidebar" class="icon" type="button" title="Hide the side panel (Ctrl+B)" aria-label="Hide the side panel">&#x2039;</button>
    </div>

    <div id="pane-netlist" class="pane netlist-pane" role="tabpanel">
      <div id="file-bar" class="file-bar">
        <nav id="file-tabs" class="tabs file-tabs" aria-label="Files"></nav>
        <span id="edit-state" class="edit-state" role="status" hidden></span>
        <button id="apply-edits" class="apply-edits" type="button" hidden title="Build the netlist again from this text, draw it and check it (Ctrl+Enter)">Apply Changes</button>
        <input id="show-failed" class="failed-check" type="checkbox" checked title="Mark the statements that do not take effect: failed with an error, or overridden in a conflict">
        <label for="show-failed" class="failed-toggle" title="Mark the statements that do not take effect: failed with an error, or overridden in a conflict">
          <span class="caption">Failed statements</span>
          <span class="key"><span class="swatch x-failed" aria-hidden="true"></span><span class="legend">error</span></span>
          <span class="key"><span class="swatch x-overridden" aria-hidden="true"></span><span class="legend">overridden</span></span>
        </label>
      </div>
      <div id="source" class="source" tabindex="-1"><p class="placeholder">No file is open.</p></div>
      <div id="hsplit" class="hsplit" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
      <section id="problems" class="problems">
        <button id="problems-head" class="problems-head" type="button" aria-expanded="true" aria-controls="problems-body">
          <span class="chevron" aria-hidden="true"></span>
          <span class="pane-title">Problems</span>
          <span id="counts" class="counts"></span>
        </button>
        <div id="problems-body" class="problems-body">
          <ul id="diags" class="diags"></ul>
        </div>
      </section>
    </div>

    <div id="pane-hierarchy" class="pane hierarchy-pane" role="tabpanel" hidden>
      <div class="sub-head"><span class="pane-title">Hierarchy</span></div>
      <div id="tree" class="tree" role="tree" aria-label="Subcircuit hierarchy"></div>
      <div id="hsplit2" class="hsplit" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
      <section id="index-section" class="index-section">
        <div class="sub-head">
          <span class="pane-title">Subcircuits</span>
          <span id="index-count" class="index-count"></span>
        </div>
        <div class="search-row">
          <input id="search" type="search" placeholder="Search by name" spellcheck="false" autocomplete="off" aria-label="Search subcircuits by name">
        </div>
        <nav id="letters" class="letters" aria-label="Initials"></nav>
        <div id="index" class="index-list" role="listbox" aria-label="Subcircuits by name"></div>
      </section>
    </div>
    <div id="pane-unplaced" class="pane unplaced-pane" role="tabpanel" hidden>
      <div class="sub-head">
        <span class="pane-title">Not drawn</span>
        <span id="unplaced-count" class="index-count"></span>
      </div>
      <div class="search-row">
        <input id="unplaced-search" type="search" placeholder="Search by name" spellcheck="false" autocomplete="off" aria-label="Search the objects not drawn by name">
      </div>
      <div id="unplaced-list" class="unplaced-list" role="listbox" aria-label="Objects of the level shown that are not drawn"></div>
    </div>
    <div id="pane-solve" class="pane solve-pane" role="tabpanel" hidden>
      <div class="sub-head">
        <span class="pane-title">Solve</span>
        <span id="solve-counts" class="counts"></span>
      </div>
      <div id="solve-report" class="solve-report"></div>
    </div>
  </aside>
  <div id="vsplit" class="vsplit" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
  <main class="drawing">
    <div class="level-bar">
      <button id="show-sidebar" class="icon" type="button" title="Show the side panel (Ctrl+B)" aria-label="Show the side panel">&#x203A;</button>
      <nav id="level-path" class="level-path" aria-label="Hierarchy path"><span id="level-name" class="level-name"></span></nav>
      <span id="level-kind" class="level-kind"></span>
      <span id="preview-badge" class="preview-badge" hidden title="Solve › Close Preview shows the file as written; Solve › Save Solved Copy As saves the solve elsewhere">Solved preview: the files are unchanged</span>
      <button id="preview-close" class="preview-close" type="button" hidden>Close Preview</button>
      <button id="up" class="up-button" type="button" hidden title="Up to the parent level (Backspace)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 2.5 6.5 6 10M2.5 6.5H10a3.5 3.5 0 0 1 3.5 3.5V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="up-name"></span>
      </button>
      <div id="path-menu" class="path-menu" role="menu" aria-label="The levels in between" hidden></div>
    </div>
    <div id="canvas" class="canvas" tabindex="-1">
      <canvas id="grid" class="grid" aria-hidden="true"></canvas>
      <p id="empty" class="empty">Open a SPICE or Spectre netlist with File &#x203A; Open (Ctrl+O).<br>Drag to move the view, scroll to zoom, click a symbol or a wire to find it in the netlist.</p>
      <button id="enter-badge" class="enter-badge" type="button" hidden title="Open the subcircuit (Enter, or double-click)" aria-label="Open the subcircuit">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 5.5 10 10M10 6.5V10H6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </main>
</div>
<footer class="statusbar">
  <span id="selection" class="selection"></span>
  <span id="notice" class="notice" role="status" hidden></span>
  <span id="note" class="note" role="status" hidden></span>
  <span id="status" class="status"></span>
  <span id="solve-status" class="solve-status" hidden><span id="solve-step"></span><button id="solve-cancel" class="solve-cancel" type="button" hidden>Cancel</button></span>
  <span id="pointer" class="pointer" title="Where the pointer is on the drawing, in units with y up"></span>
  <span id="zoom" class="zoom"></span>
</footer>
<script type="module" src="main.js"></script>
</body>
</html>

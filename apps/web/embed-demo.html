<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNL Viewer embedding demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: 16px; }
    h1 { font-size: 18px; margin: 0; }
    main { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; min-height: 0; }
    aside { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    button { background: var(--panel); border-color: var(--line); padding: 8px; text-align: left; cursor: pointer; }
    button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
    fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 4px 0 0; display: flex; flex-direction: column; gap: 6px; }
    legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
    fieldset label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
    iframe { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--canvas); }
    #events { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 600px) { main { grid-template-columns: 130px minmax(0, 1fr); } }
  </style>
</head>
<body>
  <h1>RNL Viewer · embedding demo</h1>
  <main>
    <aside aria-label="Examples">
      <button type="button" data-url="samples/cases/01-rc-lowpass.sp" disabled>RC low-pass</button>
      <button type="button" data-url="samples/cases/04-hierarchy.sp" disabled>Two-stage buffer</button>
      <button type="button" data-url="samples/cases/17-line-styles.sp" disabled>Line styles</button>
      <button type="button" data-url="samples/site/ota5t.sp" disabled>Five-transistor OTA</button>
      <fieldset id="display-controls" disabled>
        <legend>Display</legend>
        <label><input type="checkbox" data-display="names" checked> Names on hover</label>
        <label><input type="checkbox" data-display="flylines"> Flylines</label>
        <label><input type="checkbox" data-display="layout"> Layout table</label>
        <label><input type="checkbox" data-display="skeleton-parts"> Component &amp; pin skeleton</label>
        <label><input type="checkbox" data-display="skeleton-wires"> Wire skeleton</label>
        <label><input type="checkbox" data-display="usages"> Usages</label>
        <label><input type="checkbox" data-display="currents"> Current directions</label>
        <label><input type="checkbox" data-display="origins"> Registration points</label>
        <label><input type="checkbox" data-display="net-labels"> Net names</label>
      </fieldset>
    </aside>
    <iframe id="viewer" title="Interactive RNL example"></iframe>
  </main>
  <p id="events" role="status">Waiting for the viewer…</p>
  <script type="module" src="embed-demo.js"></script>
</body>
</html>
